<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ED-II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-inverse"> 
      <div class="container"> <div class="navbar-header"> 
        <a class="navbar-brand" href="/"> Listagem Países </a>
       </div> <ul class="nav navbar-nav">
         <li class="active"> <a href="/">Cadastro</a> 
        </li>
       <li> <a href="/paises">Países</a>
       </li>
       </ul>
       </div> 
      </nav>
    <div class="container text-center">
    
      
      <h4 class = "text-center"> Países Cadastrados</h4>
      <p>   </p> 
      <div class="container text-center">
        <p></p>
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>Região</th>
              <th>Operadora</th>
              <th>Tecnologia</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
          {% for pais in paises.values() %}
               <tr>
                    <td class="align-middle">{{pais["codigo"]}}</td>
                    <td class="align-middle">{{pais["pais"]}}</td>
                    <td class="align-middle">{{pais["regiao"]}}</td>
                    <td class="align-middle">{{pais["operadora"]}}</td>
                    <td class="align-middle">{{pais["tecnologia"]}}</td>
                    <td><form action="/deletar/{{pais['codigo']}}" method="post" onsubmit="return confirm('Tem certeza que deseja excluir?');">
                        <button class="btn btn-danger" type="submit">Deletar</button>
                        </form>
                    </td>
               </tr>
          {%endfor%}          
          
        </tbody>
        </table>


    </div>
      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </div>
  </body>
</html>
