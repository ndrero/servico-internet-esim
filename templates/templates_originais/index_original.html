<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ED-II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
  <!-- Barra de navegação -->
    <nav class="navbar navbar-inverse">
        <div class="container">

            <div class="navbar-header">
                <a class="navbar-brand" href="/">
                    Estruturas de Dados II
                </a>
            </div>

            <ul class="nav navbar-nav">
                <li class="active">
                    <a href="/">Cadastro</a>
                </li>

                <li>
                    <a href="/paises">Países</a>
                </li>
            </ul>

        </div>
    </nav>


    <!-- Conteúdo principal -->
    <div class="container">

        <div class="page-header">
            <h1>Cadastro de Países</h1>
            <p>Preencha os dados abaixo para cadastrar um país.</p>
        </div>


        <div class="row">

            <div class="col-md-6">

                <div class="panel panel-primary">

                    <div class="panel-heading">
                        <h3 class="panel-title">
                            Dados do país
                        </h3>
                    </div>

                    <div class="panel-body">

                        <form action="/cadastrar" method="POST">

                            <!-- Código -->
                            <div class="form-group">

                                <label for="codigo">
                                    Código:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="codigo"
                                       name="codigo"
                                       placeholder="Digite o código do país"
                                       required>

                            </div>

                            <!-- País -->
                            <div class="form-group">

                                <label for="pais">
                                    Nome:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="pais"
                                       name="pais"
                                       placeholder="Digite o nome do país"
                                       required>

                            </div>


                            <!-- Região -->
                            <div class="form-group">

                                <label for="regiao">
                                    Região:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="regiao"
                                       name="regiao"
                                       placeholder="Digite a região do país"
                                       required>

                            </div>


                            <!-- Operadora -->
                            <div class="form-group">

                                <label for="operadora">
                                    Operadora:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="operadora"
                                       name="operadora"
                                       min="1"
                                       max="20"
                                       placeholder="Digite a operadora do país">

                            </div>


                            <!-- Tecnologia -->
                            <div class="form-group">

                                <label for="tecnologia">
                                    Tecnologia:
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="tecnologia"
                                       name="tecnologia"
                                       placeholder="Digite a tecnologia da operadora">

                            </div>


                            <!-- Botões -->

                            <button type="submit"
                                    class="btn btn-primary">

                                <span class="glyphicon glyphicon-floppy-disk"></span>
                                Cadastrar

                            </button>

                            <button type="reset"
                                    class="btn btn-default">

                                <span class="glyphicon glyphicon-erase"></span>
                                Limpar

                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>


<!-- Rodapé -->

<footer class="text-center">

    <div class="container">

        <hr>

        <p>
            Estruturas de Dados em Python
        </p>

    </div>

</footer>



<!-- JavaScript do Bootstrap -->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js">
</script>




</body>

</html>
